version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: personal-website-backend
    restart: unless-stopped
    networks:
      - app-network
    environment:
      - RUST_LOG=info
      - DATABASE_URL=sqlite:/var/lib/personal-website/blog.db
      - UPLOAD_DIR=/var/lib/personal-website/photos
    volumes:
      # Database and photos storage (combined to avoid overlap)
      - app-data:/var/lib/personal-website

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: personal-website-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network
    volumes:
      # Share photos with frontend for serving via nginx
      - app-data:/var/lib/personal-website:ro

networks:
  app-network:
    driver: bridge

volumes:
  app-data:
    driver: local
